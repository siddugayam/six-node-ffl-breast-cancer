<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 372" width="960" height="372" font-family="Helvetica, Arial, sans-serif">
  <title>Feed-forward loop types analysed in the study</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
    <marker id="bar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M5,0 L5,10" stroke="#333333" stroke-width="2.4"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="370" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <!-- panel titles -->
  <g font-size="17" font-weight="bold" fill="#1f2328" text-anchor="middle">
    <text x="120" y="40">TF-FFL</text>
    <text x="360" y="40">miRNA-FFL</text>
    <text x="600" y="40">Composite FFL</text>
    <text x="840" y="40">n-node FFL (n = 4–7)</text>
  </g>
  <g font-size="13" fill="#57606a" text-anchor="middle">
    <text x="120" y="62">9 typed cores</text>
    <text x="360" y="62">206 typed cores</text>
    <text x="600" y="62">1,434 typed cores</text>
    <text x="840" y="62">census of Table 3</text>
  </g>
  <line x1="240" y1="80" x2="240" y2="300" stroke="#eaeef2"/>
  <line x1="480" y1="80" x2="480" y2="300" stroke="#eaeef2"/>
  <line x1="720" y1="80" x2="720" y2="300" stroke="#eaeef2"/>

  <g stroke="#333333" stroke-width="2.2" fill="none">
    <!-- TF-FFL: TF -> miRNA, TF -> target, miRNA -| target -->
    <line x1="86" y1="120" x2="152" y2="120" marker-end="url(#arrow)"/>
    <line x1="72.4" y1="142.8" x2="106.6" y2="205.4" marker-end="url(#arrow)"/>
    <line x1="167.5" y1="142.8" x2="133.4" y2="205.4" marker-end="url(#bar)"/>
    <!-- miRNA-FFL: miRNA -| TF, miRNA -| target, TF -> target -->
    <line x1="326" y1="120" x2="393" y2="120" marker-end="url(#bar)"/>
    <line x1="312.4" y1="142.8" x2="346.6" y2="205.4" marker-end="url(#bar)"/>
    <line x1="407.5" y1="142.8" x2="373.4" y2="205.4" marker-end="url(#arrow)"/>
    <!-- composite: TF -> miRNA and miRNA -| TF, TF -> target, miRNA -| target -->
    <line x1="565" y1="112" x2="632" y2="112" marker-end="url(#arrow)"/>
    <line x1="635" y1="128" x2="568" y2="128" marker-end="url(#bar)"/>
    <line x1="552.4" y1="142.8" x2="586.6" y2="205.4" marker-end="url(#arrow)"/>
    <line x1="647.5" y1="142.8" x2="613.4" y2="205.4" marker-end="url(#bar)"/>
    <!-- n-node example: one source, one sink, two vertex-disjoint paths -->
    <line x1="775.8" y1="163.2" x2="802.9" y2="133.3" marker-end="url(#arrow)"/>
    <line x1="831" y1="120" x2="852" y2="120" marker-end="url(#arrow)"/>
    <line x1="880.8" y1="131.8" x2="907.9" y2="161.7" marker-end="url(#arrow)"/>
    <line x1="775.8" y1="186.8" x2="802.9" y2="216.7" marker-end="url(#arrow)"/>
    <line x1="831" y1="230" x2="852" y2="230" marker-end="url(#arrow)"/>
    <line x1="880.8" y1="218.2" x2="907.9" y2="188.3" marker-end="url(#arrow)"/>
    <line x1="822.7" y1="134.0" x2="861.4" y2="214.2" marker-end="url(#arrow)"/>
  </g>

  <!-- nodes -->
  <g font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <circle cx="60" cy="120" r="24" fill="#2e6db4"/><text x="60" y="125">TF</text>
    <circle cx="180" cy="120" r="24" fill="#d9822b"/><text x="180" y="125">miR</text>
    <circle cx="120" cy="230" r="24" fill="#4f9a6a"/><text x="120" y="235">T</text>

    <circle cx="300" cy="120" r="24" fill="#d9822b"/><text x="300" y="125">miR</text>
    <circle cx="420" cy="120" r="24" fill="#2e6db4"/><text x="420" y="125">TF</text>
    <circle cx="360" cy="230" r="24" fill="#4f9a6a"/><text x="360" y="235">T</text>

    <circle cx="540" cy="120" r="24" fill="#2e6db4"/><text x="540" y="125">TF</text>
    <circle cx="660" cy="120" r="24" fill="#d9822b"/><text x="660" y="125">miR</text>
    <circle cx="600" cy="230" r="24" fill="#4f9a6a"/><text x="600" y="235">T</text>
  </g>
  <g>
    <circle cx="765" cy="175" r="14" fill="#57606a"/>
    <circle cx="815" cy="120" r="14" fill="#afb8c1"/>
    <circle cx="870" cy="120" r="14" fill="#afb8c1"/>
    <circle cx="815" cy="230" r="14" fill="#afb8c1"/>
    <circle cx="870" cy="230" r="14" fill="#afb8c1"/>
    <circle cx="920" cy="175" r="14" fill="#57606a"/>
  </g>

  <!-- captions -->
  <g font-size="13" fill="#1f2328" text-anchor="middle">
    <text x="120" y="282">The TF regulates the miRNA;</text>
    <text x="120" y="299">both regulate the target</text>
    <text x="360" y="282">The miRNA represses the TF;</text>
    <text x="360" y="299">both regulate the target</text>
    <text x="600" y="282">TF and miRNA regulate each other</text>
    <text x="600" y="299">and the target</text>
    <text x="840" y="282">One source, one sink, no cycle and</text>
    <text x="840" y="299">at least two parallel paths</text>
  </g>

  <!-- legend -->
  <g font-size="12.5" fill="#57606a">
    <line x1="40" y1="340" x2="72" y2="340" stroke="#333333" stroke-width="2.2" marker-end="url(#arrow)"/>
    <text x="80" y="344">regulation by a TF</text>
    <line x1="215" y1="340" x2="247" y2="340" stroke="#333333" stroke-width="2.2" marker-end="url(#bar)"/>
    <text x="257" y="344">repression by a miRNA</text>
    <circle cx="430" cy="340" r="8" fill="#2e6db4"/><text x="444" y="344">TF</text>
    <circle cx="490" cy="340" r="8" fill="#d9822b"/><text x="504" y="344">miRNA</text>
    <circle cx="575" cy="340" r="8" fill="#4f9a6a"/><text x="589" y="344">target (gene or TF)</text>
    <circle cx="740" cy="340" r="8" fill="#57606a"/><text x="754" y="344">source / sink</text>
  </g>
</svg>
