<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Helvetica, Arial, sans-serif">
  <title>Number of n-node feed-forward loop modules in the census graph (Table 3)</title>
  <rect x="1" y="1" width="758" height="328" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  <text x="30" y="36" font-size="16" font-weight="bold" fill="#1f2328">Feed-forward loop modules in the census graph (Table 3)</text>
  <text x="30" y="56" font-size="12.5" fill="#57606a">Exhaustive counts at n = 3–6; RAND-ESU estimate (eight seeds) at n = 7. Logarithmic scale.</text>

  <!-- grid: one line per decade, 10^3 (y = 270) to 10^9 (y = 80) -->
  <g stroke="#eaeef2" stroke-width="1">
    <line x1="90" y1="270" x2="730" y2="270"/><line x1="90" y1="238.3" x2="730" y2="238.3"/>
    <line x1="90" y1="206.7" x2="730" y2="206.7"/><line x1="90" y1="175" x2="730" y2="175"/>
    <line x1="90" y1="143.3" x2="730" y2="143.3"/><line x1="90" y1="111.7" x2="730" y2="111.7"/>
    <line x1="90" y1="80" x2="730" y2="80"/>
  </g>
  <g font-size="12" fill="#57606a" text-anchor="end">
    <text x="80" y="274">10³</text><text x="80" y="242.3">10⁴</text><text x="80" y="210.7">10⁵</text>
    <text x="80" y="179">10⁶</text><text x="80" y="147.3">10⁷</text><text x="80" y="115.7">10⁸</text><text x="80" y="84">10⁹</text>
  </g>
  <line x1="90" y1="270" x2="730" y2="270" stroke="#8c959f"/>

  <!-- bars: y = 270 - (log10(count) - 3) * 31.667 -->
  <g fill="#2e6db4">
    <rect x="119" y="245.7" width="70" height="24.3" rx="3"/>
    <rect x="247" y="204.6" width="70" height="65.4" rx="3"/>
    <rect x="375" y="169.4" width="70" height="100.6" rx="3"/>
    <rect x="503" y="134.2" width="70" height="135.8" rx="3"/>
  </g>
  <rect x="631" y="100.5" width="70" height="169.5" rx="3" fill="#9db9dd" stroke="#2e6db4" stroke-dasharray="5 3"/>

  <g font-size="12.5" font-weight="bold" fill="#1f2328" text-anchor="middle">
    <text x="154" y="238">5,833</text>
    <text x="282" y="197">116,505</text>
    <text x="410" y="162">1,506,263</text>
    <text x="538" y="127">19,401,840</text>
    <text x="666" y="93">≈ 2.26 × 10⁸</text>
  </g>
  <g font-size="13" fill="#1f2328" text-anchor="middle">
    <text x="154" y="290">n = 3</text><text x="282" y="290">n = 4</text><text x="410" y="290">n = 5</text>
    <text x="538" y="290">n = 6</text><text x="666" y="290">n = 7</text>
  </g>
  <text x="30" y="316" font-size="12" fill="#57606a">Typed three-node TF–miRNA cores of the analysed network: 1,649 (1,434 composite, 206 miRNA-FFL, 9 TF-FFL; Table S4).</text>
</svg>
